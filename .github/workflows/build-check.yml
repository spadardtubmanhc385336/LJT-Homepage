name: Build check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: List generated pages
        run: find _site -name '*.html' | sort
      - name: Check personal content is rendered
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Text(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []
                  self.skip = 0
              def handle_starttag(self, tag, attrs):
                  if tag in ('script', 'style'):
                      self.skip += 1
              def handle_endtag(self, tag):
                  if tag in ('script', 'style') and self.skip:
                      self.skip -= 1
              def handle_data(self, data):
                  if not self.skip and data.strip():
                      self.parts.append(data.strip())

          for page in ['index.html', 'publications/index.html', 'cv/index.html']:
              html = Path('_site', page).read_text()
              parser = Text()
              parser.feed(html)
              text = ' | '.join(parser.parts)
              print('===== ' + page + ' =====')
              print(text)
              for title in [
                  'SynLogic',
                  'On the Perception Bottleneck of VLMs for Chart Understanding',
                  'On the Universal Truthfulness Hyperplane Inside LLMs',
                  'In-Context Sharpness as Alerts',
                  'C-Eval',
                  'Composing Parameter-Efficient Modules with Arithmetic Operations',
              ]:
                  assert title in text, (page, title)
              for fact in ['jliugi@connect.ust.hk', 'MINIMAX', 'Tencent WXG', 'Shanghai AI Lab',
                           'Zhiyuan Honor Scholarship', 'Professor Junxian He', 'Vicent0205']:
                  assert fact in text, (page, fact)
              print('CHECKS PASSED: ' + page)
          PY
